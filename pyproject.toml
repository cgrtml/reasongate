[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasongate"
version = "0.7.0"
description = "Explainable, model-agnostic LLM security gate: every block carries a reason."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Cagri Temel" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "guardrail", "explainable", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core (Shield + the rule/normalize/indirect/canary detectors) is PURE PYTHON - zero dependencies.
dependencies = []

[project.scripts]
reasongate-mcp = "reasongate.mcp.gateway:main"
reasongate = "reasongate.mcp.gateway:main"        # same gateway; lets `uvx reasongate -- <server>` work
reasongate-audit = "reasongate.mcp.report:main"

[project.optional-dependencies]
judge = ["anthropic>=1; python_version >= '3.10'"]   # the 1.x SDK needs 3.10+; the core stays 3.9+
# NOTE: the ML detector + trained model + provenance now ship in the separate
# "reasongate-enterprise" add-on (installing it auto-enables them via plugins).
# These extras only cover the OPEN parts: reproducing the public benchmarks and
# the rule-core demo server.
eval = ["voyageai>=0.3", "scikit-learn>=1.3", "numpy<2", "joblib>=1.3", "datasets>=2.0"]
serve = ["fastapi>=0.104", "uvicorn>=0.24", "pydantic>=2.0"]   # rule-core demo, no keys
dev = ["pytest>=7", "reasongate[serve]"]

[project.urls]
Homepage = "https://github.com/cgrtml/reasongate"
Issues = "https://github.com/cgrtml/reasongate/issues"

[tool.setuptools.packages.find]
include = ["reasongate*"]
exclude = ["eval*", "app*", "examples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
