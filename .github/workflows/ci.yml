name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The core has ZERO DEPENDENCIES: installing it pulls in no external package.
      # This step passing is the proof of the "installs on an air-gapped network" claim.
      - name: Install core (zero dependencies)
        run: pip install -e .

      - name: Core import smoke (no external deps)
        run: python -c "import reasongate; from reasongate import Shield; print('reasongate', reasongate.__version__)"

      - name: Install test tooling
        run: pip install pytest

      - name: Run tests
        run: pytest -q
